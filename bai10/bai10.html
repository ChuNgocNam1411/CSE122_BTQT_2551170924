<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang liên hệ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="contact-from">
            <div class="form-header">
                <h2>Liên hệ với chúng tôi</h2>
                <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24h.</p>
            </div>
            <form action="#" methos="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="hoten">Họ và tên</label>
                        <input type="text" id="hoten" name="hoten"
                                value="Nguyễn Văn An" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email"
                            value="an.nv@tlu.edu.vn" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="sdt">Số điện thoại</label>
                        <input type="tel" id="sdt" name="sdt"
                                value="0987 654 321" >
                    </div>
                    <div class="form-group">
                        <label for="chude">Chủ đề</label>
                        <select id="chude" name="chude">
                            <option>Hỏi về khóa học</option>
                            <option>Hỗ trợ kỹ thuật</option>
                            <option>Góp ý</option>
                            <option>Khác</option>
                        </select>
                    </div>
                </div>
                <div class="form-group message-group">
                    <label for="noidung">Nội dung</label>
                    <textarea id="noidung" name="noidung"
                              rows="4" required>Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
                </div>
                <div class="form-footer">
                    <div class="checkbox-group">
                        <input type="checkbox" id="dongy" name="dongy" checked>
                        <label for="dongy">
                            Tôi đồng ý nhận email phản hồi.
                        </label>
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="sumbit" class="btn-sumbit">
                        Gửi liên hệ
                    </button>
                    <button type="reset" class="btn-reset">
                        Nhập lại
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
