<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSE.TLU Admin - Bảng điều khiển</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .sidebar {
      width: 230px;
      min-height: 100vh;
      background-color: #212529;
      color: #ffffff;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }
    .sidebar .nav-link {
      color: rgba(255, 255, 255, 0.75);
      border-radius: 6px;
      padding: 10px 15px;
      margin-bottom: 4px;
    }
    .sidebar .nav-link:hover {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.1);
    }
    .sidebar .nav-link.active {
      background-color: #0d6efd;
      color: #ffffff;
      font-weight: 500;
    }
    .main-content {
      margin-left: 230px;
      padding: 25px 30px;
    }
    .progress {
      height: 6px;
      background-color: #e9ecef;
      border-radius: 10px;
    }
    .card-progress {
      height: 4px;
    }
  </style>
</head>
<body>
  <aside class="sidebar d-flex flex-column p-3">
    <a href="#" class="d-flex align-items-center mb-4 me-md-auto text-white text-decoration-none fs-5 fw-bold ms-2">
      CSE.TLU Admin
    </a>
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item">
        <a href="#" class="nav-link active" aria-current="page">
          Bảng điều khiển
        </a>
      </li>
      <li>
        <a href="#" class="nav-link text-white-50">
          Bài tập
        </a>
      </li>
      <li>
        <a href="#" class="nav-link text-white-50">
          Sinh viên
        </a>
      </li>
      <li>
        <a href="#" class="nav-link text-white-50">
          Điểm số
        </a>
      </li>
    </ul>
  </aside>
  <main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold m-0">Bảng điều khiển</h3>
      <div>
        <span class="badge bg-warning text-dark px-2 py-2 me-2 fs-6 fw-normal">3 bài mới</span>
        <button class="btn btn-primary btn-sm px-3 py-2">Xuất báo cáo</button>
      </div>
    </div>
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card border-0 shadow-sm p-3">
          <div class="text-secondary small mb-1">Sinh viên</div>
          <div class="fs-2 fw-bold text-dark mb-3">128</div>
          <div class="progress card-progress">
            <div class="progress-bar bg-primary" role="progressbar" style="width: 70%;" aria-label="Sinh viên"></div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm p-3">
          <div class="text-secondary small mb-1">Đã nộp</div>
          <div class="fs-2 fw-bold text-dark mb-3">96</div>
          <div class="progress card-progress">
            <div class="progress-bar bg-success" role="progressbar" style="width: 75%;" aria-label="Đã nộp"></div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm p-3">
          <div class="text-secondary small mb-1">Chưa nộp</div>
          <div class="fs-2 fw-bold text-dark mb-3">32</div>
          <div class="progress card-progress">
            <div class="progress-bar bg-danger" role="progressbar" style="width: 25%;" aria-label="Chưa nộp"></div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm p-3">
          <div class="text-secondary small mb-1">Điểm TB</div>
          <div class="fs-2 fw-bold text-dark mb-3">7.8</div>
          <div class="progress card-progress">
            <div class="progress-bar bg-warning" role="progressbar" style="width: 78%;" aria-label="Điểm trung bình"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card border-0 shadow-sm p-4">
      <h6 class="fw-bold mb-3">Tiến độ theo chương</h6>
      <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
          <span>Chương 1 — HTML5</span>
          <span class="badge bg-success px-2 py-1">100%</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
          <span>Chương 2 — JavaScript</span>
          <span class="badge bg-info text-white px-2 py-1">82%</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
          <span>Chương 3 — CSS3</span>
          <span class="badge bg-info text-white px-2 py-1">74%</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3 border-bottom-0">
          <span>Chương 4 — Bootstrap 5</span>
          <span class="badge bg-secondary px-2 py-1">45%</span>
        </li>
      </ul>
    </div>
  </main>
</body>
</html>
