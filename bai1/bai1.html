<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BỐN MÙA</title>
</head>
<body>
<style> 
    body{
        font-family:'Times New Roman', serif;
    }
    .khung{
        width:700px;
        margin: 20px auto;
        background-color: #FFFDE7;
        border: 1px solid #9E9E9E;
        padding: 20px;
        text-align: center;
    }
    h1{
        background-color: #FFD9E6;
        color: #D40000;
        margin-top: 0;
        padding: 10px;
        font-weight: bold;
    }
    .kho1, .kho3{
        color: #0033CC;
        font-style: italic;
        font-size: 20px;
        line-height: 1.6;
    }
    .kho2{
        color: #D40000;
        font-style: italic;
        font-size: 20px;
        line-height: 1.6;
    }
    hr{
        width:55%;
        border: none;
        border-top: 2px solid #0033CC;
        margin: 20px auto;
    }
</style>
  
</body>
<div class="khung">
    <h1>BỐN MÙA </h1>
    <div class="kho1">
        Xuân về hoa nở khắp trời <br>
        Hạ sang nắng cháy rạng ngời phố quen <br>
        Thu về lá rụng bên thềm
    </div>
    <hr>
    <div class="kho2">
        Đông sang gió lạnh bên em đợi chờ <br>
        Bốn mùa là bốn giấc mơ <br>
        Thời gian đi mãi ta chờ đợi ai
    </div>
    <hr>
    <div class="kho3"> 
        Một năm rồi lại một năm <br>
        Vẫn còn câu hát thì thầm quê hương <br>
        Chờ xuân nắng mới soi đường 
    </div>
</div>
</body>
</html>
