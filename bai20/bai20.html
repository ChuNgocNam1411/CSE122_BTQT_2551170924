<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 20 - CSS Filter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="flower-card">
            <img id="flower" src="hoa-hong.jpg" alt="Hoa hồng">
            <div class="caption">Special For You</div>
        </div>
        <div class="buttons">
            <button class="active" data-effect="gray">Gray</button>
            <button data-effect="xray">Xray</button>
            <button data-effect="invert">Invert</button>
            <button data-effect="fliph">FlipH</button>
            <button data-effect="flipv">FlipV</button>
            <button data-effect="glow">Glow</button>
            <button data-effect="shadow">Shadow</button>
            <button data-effect="bold-shadow">Bold Shadow</button>
            <button data-effect="dropshadow">DropShadow</button>
            <button data-effect="blur">Blur</button>
            <button data-effect="wave">Wave</button>
            <button data-effect="mask">Mask</button>
            <button data-effect="alpha">Alpha</button>
        </div>
    </div>
    <script src="bai20.js"></script>
</body>
</html>
