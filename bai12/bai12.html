<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In lịch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calendar">
            <div class="year" id="year">2026</div>
            <div class="month" id="month">Tháng 12</div>
            <div class="day" id="day">25</div>
            <div class="weekday" id="weekday">Thứ năm</div>
        </div>
        <div class="greeting" id="greeting">
            Chào buổi sáng!
        </div>
        <form id="dateForm">
            <div class="input-group">
                <label for="inputDay">Ngày</label>
                <input type="number" id="inputDay"
                       min="1" max="31" value="24" required> 
            </div>
            <div class="input-group">
                <label for="inputMonth">Tháng</label>
                <input type="number" id="inputMonth"
                       min="1" max="12" value="12" required>
            </div>
                       <div class="input-group">
                <label for="inputYear">Năm</label>
                <input type="number" id="inputYear"
                       min="1" max="9999" value="2026" required>
            </div>
            <button type="sumbit">In<br>Lịch</button>
        </form>
    </div>
    <script src="bai12.js"></script>
</body>
</html>
