<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh - Hiệu ứng Hover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery">
        <h1>Thư viện ảnh — Hiệu ứng Hover</h1>
        <p class="description">
            Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.
        </p>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="Vinh-Ha-Long.jpg" alt="Vịnh Hạ Long">
                <div class="overlay">
                    <span>Vịnh Hạ Long</span>
                </div>
            </div>
            <div class="gallery-item">
                <img src="Hang-Son-Doong.jpg" alt="Hang Sơn Đoòng">
                <div class="overlay">
                    <span>Hang Sơn Đoòng</span>
                </div>
            </div>
            <div class="gallery-item">
                <img src="Thac-ban-Gioc.jpg" alt="Thác Bản Giốc">
                <div class="overlay">
                    <span>Thác Bản Giốc</span>
                </div>
            </div>
            <div class="gallery-item">
                <img src="Anh/Bai23/anh4.jpg" alt="Fansipan">
                <div class="overlay">
                    <span>Fansipan</span>
                </div>
            </div>
            <div class="gallery-item">
                <img src="Anh/Bai23/anh5.jpg" alt="Đồng bằng sông Cửu Long">
                <div class="overlay">
                    <span>Đồng bằng sông Cửu Long</span>
                </div>
            </div>
            <div class="gallery-item">
                <img src="Anh/Bai23/anh6.jpg" alt="Động Phong Nha">
                <div class="overlay">
                    <span>Động Phong Nha</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
