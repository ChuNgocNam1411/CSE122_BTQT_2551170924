<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh Việt Nam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
        <h1>Thư viện ảnh Việt Nam</h1>
        <p>Bộ sưu tập 6 danh thắng tiêu biểu - minh họa thẻ figure/figcaption</p>
    </header>
    <main class="gallery">
        <figure>
            <img src="Vinh-Ha-Long.jpg" alt="Vịnh Hạ Long">
            <figcaption>Hình 1.Vịnh Hạ Long</figcaption>
        </figure>
        <figure>
            <img src="Hang-Son-Doong.jpg" alt="Hang Sơn Đoòng">
            <figcaption>Hình 2.Hang Sơn Đoòng</figcaption>
        </figure>
        <figure>
            <img src="Thac-ban-Gioc.jpg" alt="Thác bản Giốc">
            <figcaption>Hình 3.Thác bản Giốc</figcaption>
        </figure>
        <figure>
            <img src="Fansipan.jpg" alt="Fansipan">
            <figcaption>Hình 4.Fansipan</figcaption>
        </figure>
        <figure>
            <img src="Dong-bang-song-Cuu-Long.jpg" alt="Đồng bằng sông Cửu Long">
            <figcaption>Hình 5.Đồng bằng sông Cửu Long</figcaption>
        </figure>
        <figure>
            <img src="Dong-Phong-Nha.jpg" alt="Động Phong Nha">
            <figcaption>Hình 6.Động Phong Nha</figcaption>
        </figure>
    </main>
    </div>
</body>
</html>
